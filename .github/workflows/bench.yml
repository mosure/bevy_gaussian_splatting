name: bench

on:
  pull_request:
    types: [ labeled, synchronize ]
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench:
    if: contains(github.event.pull_request.labels.*.name, 'bench')

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-14]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-build-stable-${{ hashFiles('**/Cargo.toml') }}

    - name: io benchmark
      uses: boa-dev/criterion-compare-action@v3.2.4
      with:
        benchName: "io"
        branchName: ${{ github.base_ref }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # Keep this opt-in suite headless and CPU-only. In particular, do not run
    # the separately gated `lod_gpu` benchmark or enable the viewer bundle.
    - name: LoD CPU Criterion benchmark
      env:
        RUN_GPU_LOD_BENCHMARKS: "0"
      run: >-
        cargo bench --locked --no-default-features
        --features "lod_build_sh3,lod,testing"
        --bench lod -- --noplot

name: clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-07-30

jobs:
  clippy:
    # Feature semantics are target-independent; run the expensive all-targets
    # lint once, while build/test workflows retain cross-platform coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain with caching
      uses: brndnmtthws/rust-action@v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt, clippy
        enable-sccache: "false"

    - name: lint
      run: cargo clippy --locked --all-targets --features="lod_build testing" -- -D warnings

    - name: lint supported LoD profiles
      shell: bash
      run: |
        cargo clippy --locked --lib --tests --no-default-features \
          --features="planar lod_render sh0 testing io_flexbuffers" -- -D warnings
        cargo clippy --locked --lib --tests --no-default-features \
          --features="planar lod_render sh0 testing io_flexbuffers precompute_covariance_3d" \
          -- -D warnings
        cargo clippy --locked --lib --no-default-features \
          --features="planar buffer_storage lod sh0 sort_std io_flexbuffers" -- -D warnings

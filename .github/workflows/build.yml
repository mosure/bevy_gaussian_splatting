name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-07-30

jobs:
  source_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain with caching
      uses: brndnmtthws/rust-action@v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt, clippy
        enable-sccache: "false"

    - name: formatting and whitespace
      shell: bash
      run: |
        cargo fmt --all -- --check
        git show --check --format= HEAD


  build_tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain with caching
      uses: brndnmtthws/rust-action@v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: rustfmt, clippy
        enable-sccache: "false"

    - name: build tools
      run: cargo build --locked --bin ply_to_gcloud --bin build_lod --features="lod_build testing"

    - name: check standalone LoD builder contract
      run: cargo check --locked --no-default-features --bin build_lod --features="lod_build"

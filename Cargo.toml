[package]
name = "bevy_gaussian_splatting"
description = "bevy gaussian splatting render pipeline plugin"
version = "9.0.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "bevy",
  "gaussian-splatting",
  "render-pipeline",
  "ply",
]
categories = [
  "computer-vision",
  "graphics",
  "rendering",
  "rendering::data-formats",
]
homepage = "https://github.com/mosure/bevy_gaussian_splatting"
repository = "https://github.com/mosure/bevy_gaussian_splatting"
readme = "README.md"
exclude = [
  ".cargo",
  ".devcontainer",
  ".github",
  ".vscode",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
  "fuzz",
  "tools/*.md",
  "tools/*.ps1",
  "tools/*.py",
  "tools/*.sh",
  "www",
]
default-run = "bevy_gaussian_splatting"


# TODO: add a feature flag for each gaussian format
# TODO: resolve one-hot feature flags through runtime configuration
[features]
default = [
  "io_flexbuffers",
  "io_ply",

  "lod_render",

  # "packed",
  "planar",

  # "buffer_texture",

  "sh3",

  # "precompute_covariance_3d",

  "query_select",
  # "query_sparse",

  # TODO: bevy_interleave storage bind group read_only per plane attribute support
  # "morph_particles",
  "morph_interpolate",

  "sort_bitonic",
  "sort_rayon",
  "sort_std",

  "tooling",
  "viewer",

  "file_asset",
  "web_asset",
]

debug_gpu = []

io_bincode2 = ["dep:bincode2", "dep:flate2"]
io_flexbuffers = ["dep:flexbuffers"]
io_ply = ["dep:ply-rs"]

# Portable hierarchy/page contracts always compile; this flag installs the
# asset loaders and GPU/runtime LoD systems. Native transient hierarchy
# construction uses Bevy's worker pool so large flat clouds never block the
# main application schedule.
lod = [
  "dep:js-sys",
  "dep:sha2",
  "dep:wasm-bindgen-futures",
  "dep:ureq",
  "bevy/multi_threaded",
  # The canonical package builder emits Flexbuffers manifests. Runtime package
  # loading must decode that format without relying on unrelated default flags.
  "io_flexbuffers",
]
# Supported storage-buffer LoD renderer bundle. The internal `lod_render_path`
# cfg additionally excludes the deprecated buffer-texture and WebGL2 paths.
lod_render = ["lod", "buffer_storage", "sort_radix"]
# Production package builder core. The spherical-harmonic degree is part of
# the portable package ABI, so callers must select it explicitly instead of
# inheriting a desktop-only default. Use `lod_build_sh3` for canonical desktop
# PLY assets and `lod_build_sh0` for the official web profile.
lod_build = [
  "planar",
  "buffer_storage",
  "sort_rayon",
  "sort_std",
  "io_flexbuffers",
  "io_ply",
  "dep:pollster",
  "dep:rustix",
  "dep:sha2",
  "dep:windows-sys",
]
lod_build_sh0 = ["lod_build", "sh0"]
lod_build_sh3 = ["lod_build", "sh3"]

material_noise = ["noise", "dep:noise"]

morph_particles = []
morph_interpolate = []

noise = []

sh0 = []
sh1 = []
sh2 = []
sh3 = []
sh4 = []

precompute_covariance_3d = []

packed = []
planar = []

buffer_storage = []
buffer_texture = []

query_raycast = []
query_select = []
query_sparse = ["dep:kd-tree", "query_select"]

sort_bitonic = []
sort_radix = []
sort_rayon = ["dep:rayon"]
sort_std = []

testing = []
tooling = ["dep:byte-unit"]
debug_tooling = ["tooling"]

headless = [
  "bevy/png",
  "io_flexbuffers",
  "io_ply",
  "planar",
  "lod_render",
  "sh3",
  "sort_rayon",
  "sort_std",
  "sort_bitonic",
]

viewer = [
  "dep:bevy-inspector-egui",
  "dep:bevy_panorbit_camera",
  "bevy_panorbit_camera/bevy_egui",
  # "bevy_transform_gizmo",
  "bevy/bevy_gizmos",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/multi_threaded",  # bevy screenshot functionality requires bevy/multi_threaded as of 0.12.1
  "bevy/png",
]

web = [
  "lod_render",
  "sh0",
  "io_flexbuffers",
  "io_ply",
  "planar",
  "sort_std",
  "viewer",
  "web_asset",
  "webgpu",
]
file_asset = []
web_asset = [
  "bevy/http",
  "bevy/https",
]

# note: webgl2/buffer_texture are deprecated
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]


[dependencies]
base64 = "0.22"
bevy-inspector-egui = { version = "0.37.0", optional = true, default-features = false, features = ["bevy"] }
bevy_args = "4.0.0"
bevy_interleave = "0.10.0"
bevy_panorbit_camera = { version = "0.35.0", optional = true }
bincode2 = { version = "2.0", optional = true }
byte-unit = { version = "5.2", optional = true }
bytemuck = "1.23"
clap = { version = "4.5", features = ["derive"] }
flate2  = { version = "1.1", optional = true }
flexbuffers = { version = "25.2", optional = true }
gltf = "1.4"
half = { version = "2.7", features = ["serde"] }
# image = { version = "0.25.6", default-features = false, features = ["png"] }
kd-tree = { version = "0.6", optional = true }
noise = { version = "0.9.0", optional = true }
ply-rs = { version = "0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
rand = "0.9"
rayon = { version = "1.8", optional = true }
serde = "1.0"
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
static_assertions = "1.1"
typenum = "1.18"
wgpu = "29"


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "=3.3.0", optional = true }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos", target_os = "redox"))'.dependencies]
rustix = { version = "1.1", optional = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[dependencies.bevy]
version = "0.19.0"
default-features = false
features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_winit",
  "serialize",
  "std",
  "zstd_rust",
  "x11",
]


[dependencies.web-sys]
version = "0.3"
features = [
  'AbortController',
  'AbortSignal',
  'Cache',
  'CacheStorage',
  'Document',
  'Element',
  'Headers',
  'HtmlElement',
  'Location',
  'Node',
  'Request',
  'RequestInit',
  'ReadableStream',
  'ReadableStreamDefaultReader',
  'Response',
  'Url',
  'Window',
]


[dev-dependencies]
crossbeam-channel = "0.5.15"
futures-intrusive = { version = "0.5.0" }
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1


[lib]
path = "src/lib.rs"

[[test]]
name = "headless_examples"
path = "tests/headless_examples.rs"
required-features = ["viewer", "io_ply"]

[[bin]]
name = "bevy_gaussian_splatting"
path = "viewer/viewer.rs"
required-features = ["viewer"]

[[bin]]
name = "ply_to_gcloud"
path = "tools/ply_to_gcloud.rs"
required-features = ["io_ply", "tooling"]

[[bin]]
name = "build_lod"
path = "tools/build_lod.rs"
required-features = ["lod_build"]

[[bin]]
name = "compare_aabb_obb"
path = "tools/compare_aabb_obb.rs"
required-features = ["debug_tooling"]

[[bin]]
name = "surfel_plane"
path = "tools/surfel_plane.rs"
required-features = ["debug_tooling"]

[[bin]]
name = "render_trellis_thumbnails"
path = "tools/render_trellis_thumbnails.rs"
required-features = ["io_ply"]


[[bin]]
name = "test_gaussian"
path = "tests/gpu/gaussian.rs"
required-features = ["testing"]

[[bin]]
name = "test_radix"
path = "tests/gpu/radix.rs"
required-features = ["debug_gpu", "sort_radix", "testing"]

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "headless"
path = "examples/headless.rs"
required-features = ["headless"]

[[example]]
name = "multi_camera"
path = "examples/multi_camera.rs"
required-features = ["viewer"]


[[bench]]
name = "io"
harness = false

[[bench]]
name = "lod"
harness = false
required-features = ["lod_build", "lod", "testing"]

[[bench]]
name = "lod_gpu"
harness = false
required-features = ["lod_build", "testing"]
